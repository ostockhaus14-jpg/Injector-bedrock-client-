name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild HorionInjector.sln /restore /p:Configuration=Release /p:Platform=x64

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: HorionInjector
          path: HorionInjector/bin/**/Release/**
